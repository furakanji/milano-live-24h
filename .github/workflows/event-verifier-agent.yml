name: EventVerifierAgent — Ricerca & Verifica Eventi 24h

on:
  schedule:
    # Aggiornamento "live": 3 volte al giorno (orari UTC; ~06:00, 14:00, 20:00 a Milano in inverno,
    # ~07:00, 15:00, 21:00 in estate)
    - cron: '0 5 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/eventVerifierAgent.js'
      - 'src/data/milanEventsGenerator.js'

permissions:
  contents: write

jobs:
  verify-and-update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run EventVerifierAgent Pipeline
        run: node backend/eventVerifierAgent.js

      - name: Commit updated verified-events-24h.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/verified-events-24h.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(agent): update verified 24h events feed via EventVerifierAgent [skip ci]"
            git push
          else
            echo "Nessuna modifica al feed verificato."
          fi
