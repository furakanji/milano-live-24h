name: Update Milan Events Feed (Multi-Source Crawlers)

on:
  schedule:
    # Run every 2 hours: at minute 15
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/crawlers/**'
      - 'scripts/crawl-milan-sources.mjs'

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run multi-source Milan event crawlers
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          CLOUD_SYNC_URL: ${{ secrets.CLOUD_SYNC_URL }}
          CLOUD_SYNC_SECRET: ${{ secrets.CLOUD_SYNC_SECRET }}
        run: node scripts/crawl-milan-sources.mjs

      - name: Commit fallback snapshot to Git (only if cloud sync is unconfigured or once daily at 00:00 UTC)
        env:
          HAS_CLOUD_SYNC: ${{ secrets.FIREBASE_PROJECT_ID || secrets.CLOUD_SYNC_URL }}
        run: |
          HOUR=$(date -u +%H)
          if [ -n "$HAS_CLOUD_SYNC" ] && [ "$HOUR" != "00" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Cloud sync is configured. Skipping frequent Git commits to keep repository history clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live-events.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(crawler): snapshot fallback live-events.json [skip ci]"
            git push
          else
            echo "No changes in live events."
          fi
